services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spec2backlog
      POSTGRES_PASSWORD: spec2backlog
      POSTGRES_DB: spec2backlog
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  chroma:
    image: chromadb/chroma:latest
    volumes: [chromadata:/data]
    ports: ["8001:8000"]
  backend:
    build: ./backend
    env_file: .env
    depends_on: [db, chroma]
    volumes: ["./backend:/app", "./data:/data"]
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  frontend:
    image: node:22
    working_dir: /web
    volumes: ["./frontend:/web"]
    ports: ["5173:5173"]
    environment:
      BACKEND_URL: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on: [backend]
volumes: {pgdata: {}, chromadata: {}}
